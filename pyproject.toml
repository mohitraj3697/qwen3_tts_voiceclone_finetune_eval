[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-voiceclone"
version = "0.1.0"
description = "Isolated Qwen3-TTS single-speaker voice-cloning workflow using official scripts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "huggingface-hub>=0.24",
  "hf_transfer>=0.1.9",
  "soundfile>=0.12",
]

[project.urls]
Homepage = "https://github.com/mohitraj3697/qwen3_tts_voiceclone_finetune_eval"
Repository = "https://github.com/mohitraj3697/qwen3_tts_voiceclone_finetune_eval.git"

[project.optional-dependencies]
train = ["wandb>=0.22.3"]
eval = ["faster-whisper>=1.1", "jiwer>=3.0", "speechbrain>=1.0", "torch>=2.4"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
qwen-voiceclone = "qwen_voiceclone.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]
